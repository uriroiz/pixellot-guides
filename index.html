<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <title>Pixellot Guides - Documentation Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141b2d;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --card-bg: #1e293b;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            padding: 4rem 2rem 3rem;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: -1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .version-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            font-size: 0.875rem;
            color: var(--accent-blue);
            font-family: 'Courier New', monospace;
            margin-top: 1rem;
        }

        .guides-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .guide-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }

        .guide-card.rtl {
            direction: rtl;
            text-align: right;
        }

        .guide-card.rtl .guide-header {
            flex-direction: row-reverse;
        }

        .guide-card.rtl .view-guide-btn {
            flex-direction: row-reverse;
        }

        .guide-card.rtl .view-guide-btn svg {
            transform: rotate(180deg);
        }

        .guide-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .guide-card.rtl::before {
            background: linear-gradient(270deg, var(--accent-blue), var(--accent-cyan));
        }

        .guide-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.2);
        }

        .guide-card:hover::before {
            transform: scaleX(1);
        }

        .guide-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .guide-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .language-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .guide-card.rtl .language-badge {
            text-transform: none;
        }

        .guide-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
            flex-grow: 1;
        }

        .guide-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: auto;
            margin-bottom: 1rem;
        }

        .guide-date {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .guide-meta-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .view-guide-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-top: auto;
            width: fit-content;
        }

        .view-guide-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }

        .view-guide-btn:active {
            transform: scale(0.98);
        }

        footer {
            text-align: center;
            padding: 3rem 2rem;
            margin-top: 4rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
        }

        .footer-links a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--accent-blue);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .guides-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .container {
                padding: 1rem;
            }

            header {
                padding: 2rem 1rem;
            }
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }

        .protected-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.375rem 0.75rem;
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #eab308;
            margin-top: 0.5rem;
        }

        /* Password Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content.rtl {
            direction: rtl;
            text-align: right;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .modal-icon {
            font-size: 2.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-description {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .password-input-group {
            margin-bottom: 1.5rem;
        }

        .password-input-group label {
            display: block;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .password-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        .password-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .password-error {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .password-error.active {
            display: block;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-btn {
            flex: 1;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9375rem;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: white;
        }

        .modal-btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }

        .modal-btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .modal-btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pixellot Guides</h1>
            <p class="subtitle">Technical Documentation & Workflow Guides</p>
            <span class="version-badge">v1.0.0</span>
        </header>

        <div class="guides-grid" id="guidesGrid">
            <!-- Guides will be dynamically inserted here -->
        </div>

        <footer>
            <p>Built with modern web technologies</p>
            <div class="footer-links">
                <a href="https://github.com" target="_blank">GitHub</a>
                <a href="https://vercel.com" target="_blank">Vercel</a>
            </div>
        </footer>
    </div>

    <!-- Password Protection Modal -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <span class="modal-icon">🔒</span>
                <h3 class="modal-title" id="modalTitle">Protected Content</h3>
            </div>
            <p class="modal-description" id="modalDescription">
                This guide is password protected. Please enter the access code to continue.
            </p>
            <div class="password-input-group">
                <label for="passwordInput" id="passwordLabel">Access Code</label>
                <input 
                    type="password" 
                    id="passwordInput" 
                    class="password-input" 
                    placeholder="Enter password..."
                    autocomplete="off"
                >
                <div class="password-error" id="passwordError">Incorrect password. Please try again.</div>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-secondary" id="cancelBtn">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="submitBtn">Submit</button>
            </div>
        </div>
    </div>

    <script>
        // Guide configuration - Easy to add more guides here
        const guides = [
            {
                id: 'send-logging-vidswap-eng',
                title: 'Upload and Log Games in Pixellot',
                description: 'Complete step-by-step workflow guide for exporting, uploading, and logging game videos in the Pixellot and Vidswap platforms.',
                language: 'English',
                langCode: 'EN',
                file: 'SendLoggingVidswap_ENG.html',
                icon: '📹',
                dateUpdated: 'November 9, 2025'
            },
            {
                id: 'send-logging-vidswap-heb',
                title: 'העלאה ותיוג משחקים ב-Pixellot',
                description: 'מדריך שלב אחר שלב מלא להעלאת וידאו משחקים ורישומם בפלטפורמות Pixellot ו-Vidswap.',
                language: 'עברית',
                langCode: 'עב',
                file: 'SendLoggingVidswap_HEB.html',
                icon: '📹',
                isRTL: true,
                buttonText: 'צפה במדריך',
                dateUpdated: '9 בנובמבר 2025'
            },
            {
                id: 'developer-accounts-heb',
                title: 'פתיחת חשבונות מפתח ב-Google וב-Apple',
                description: 'מדריך שלב-אחר-שלב לפתיחת חשבונות מפתח ב-Google Play Console וב-Apple Developer Program, כולל הוראות רישום, תשלום והגדרת הרשאות.',
                language: 'עברית',
                langCode: 'עב',
                file: 'DeveloperAccounts_HEB.html',
                icon: '🔑',
                isRTL: true,
                buttonText: 'צפה במדריך',
                dateUpdated: '12 בנובמבר 2025'
            },
            {
                id: 'stats-manager-heb',
                title: 'ניהול סטטיסטיקה והכנה למשחק - ליגה לאומית',
                description: 'מדריך מקיף לשימוש במערכת ניהול הסטטיסטיקות של הליגה הלאומית - צפייה במשחקים, סטטיסטיקות קבוצתיות ואישיות, ניתוח משחקים והכנה למשחק הבא.',
                language: 'עברית',
                langCode: 'עב',
                file: 'StatsManager.html',
                icon: '📊',
                isRTL: true,
                buttonText: 'צפה במדריך',
                dateUpdated: '16 בנובמבר 2025',
                isProtected: true  // Badge only - actual protection is in the guide itself
            },
            {
                id: 'update-dashboard',
                title: 'Export and Manage Data in Pixellot CSM Dashboard',
                description: 'Step-by-step guide to export data from PowerBI, upload CSVs to CSM Dashboard 2.0, and edit client production hours.',
                language: 'English',
                langCode: 'EN',
                file: 'UpdateDashboard.html',
                icon: '📊',
                dateUpdated: 'February 22, 2026',
                isProtected: true
            }
        ];

        // Current guide being accessed
        let currentProtectedGuide = null;

        // Render guides
        function renderGuides() {
            const grid = document.getElementById('guidesGrid');
            const today = new Date();
            
            guides.forEach(guide => {
                const card = document.createElement('div');
                card.className = 'guide-card' + (guide.isRTL ? ' rtl' : '');
                
                const buttonText = guide.buttonText || 'View Guide';
                
                // Format date based on language
                // Only use today's date if dateUpdated is not specified (for new guides only)
                const dateUpdated = guide.dateUpdated || (guide.isRTL 
                    ? today.toLocaleDateString('he-IL', { year: 'numeric', month: 'long', day: 'numeric' })
                    : today.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }));
                
                const dateLabel = guide.isRTL ? 'תאריך עדכון:' : 'Date updated:';
                
                // Protected badge
                const protectedBadge = guide.isProtected 
                    ? `<div class="protected-badge">
                        <svg class="icon" fill="currentColor" viewBox="0 0 20 20" style="width: 16px; height: 16px;">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
                        </svg>
                        ${guide.isRTL ? 'מוגן בסיסמה' : 'Protected'}
                    </div>`
                    : '';
                
                card.innerHTML = `
                    <div class="guide-header">
                        <span style="font-size: 2rem;">${guide.icon}</span>
                        <span class="language-badge">${guide.langCode}</span>
                    </div>
                    <h2 class="guide-title">${guide.title}</h2>
                    <p class="guide-description">${guide.description}</p>
                    ${protectedBadge}
                    <div class="guide-date">
                        <svg class="icon" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path>
                        </svg>
                        <span>${dateLabel} ${dateUpdated}</span>
                    </div>
                    <div class="guide-meta">
                        <span class="guide-meta-item">
                            <svg class="icon" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"></path>
                                <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"></path>
                            </svg>
                            ${guide.language}
                        </span>
                    </div>
                    <button class="view-guide-btn" data-guide-id="${guide.id}">
                        ${buttonText}
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </button>
                `;
                
                // Add click event to button
                const btn = card.querySelector('.view-guide-btn');
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    handleGuideAccess(guide);
                });
                
                grid.appendChild(card);
            });
        }

        // Handle guide access (protected or direct)
        function handleGuideAccess(guide) {
            if (guide.isProtected && guide.password) {
                // Only show modal if password is defined
                currentProtectedGuide = guide;
                showPasswordModal(guide);
            } else {
                // Open directly - protection is in the guide itself if needed
                window.open(guide.file, '_blank');
            }
        }

        // Show password modal
        function showPasswordModal(guide) {
            const modal = document.getElementById('passwordModal');
            const modalContent = document.getElementById('modalContent');
            const modalTitle = document.getElementById('modalTitle');
            const modalDescription = document.getElementById('modalDescription');
            const passwordLabel = document.getElementById('passwordLabel');
            const passwordInput = document.getElementById('passwordInput');
            const submitBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const passwordError = document.getElementById('passwordError');

            // Set RTL if needed
            if (guide.isRTL) {
                modalContent.classList.add('rtl');
                modalTitle.textContent = 'תוכן מוגן';
                modalDescription.textContent = 'מדריך זה מוגן בסיסמה. אנא הזן את קוד הגישה כדי להמשיך.';
                passwordLabel.textContent = 'קוד גישה';
                passwordInput.placeholder = 'הזן סיסמה...';
                submitBtn.textContent = 'אישור';
                cancelBtn.textContent = 'ביטול';
                passwordError.textContent = 'סיסמה שגויה. נסה שוב.';
            } else {
                modalContent.classList.remove('rtl');
                modalTitle.textContent = 'Protected Content';
                modalDescription.textContent = 'This guide is password protected. Please enter the access code to continue.';
                passwordLabel.textContent = 'Access Code';
                passwordInput.placeholder = 'Enter password...';
                submitBtn.textContent = 'Submit';
                cancelBtn.textContent = 'Cancel';
                passwordError.textContent = 'Incorrect password. Please try again.';
            }

            // Clear previous input and errors
            passwordInput.value = '';
            passwordError.classList.remove('active');
            
            // Show modal
            modal.classList.add('active');
            passwordInput.focus();
        }

        // Close password modal
        function closePasswordModal() {
            const modal = document.getElementById('passwordModal');
            const passwordInput = document.getElementById('passwordInput');
            const passwordError = document.getElementById('passwordError');
            
            modal.classList.remove('active');
            passwordInput.value = '';
            passwordError.classList.remove('active');
            currentProtectedGuide = null;
        }

        // Verify password and open guide
        function verifyAndOpenGuide() {
            const passwordInput = document.getElementById('passwordInput');
            const passwordError = document.getElementById('passwordError');
            const enteredPassword = passwordInput.value;

            if (currentProtectedGuide && enteredPassword === currentProtectedGuide.password) {
                // Password correct - open guide
                window.open(currentProtectedGuide.file, '_blank');
                closePasswordModal();
            } else {
                // Password incorrect - show error
                passwordError.classList.add('active');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // Initialize
        renderGuides();

        // Event listeners for password modal
        document.getElementById('cancelBtn').addEventListener('click', closePasswordModal);
        document.getElementById('submitBtn').addEventListener('click', verifyAndOpenGuide);
        
        // Close modal on overlay click
        document.getElementById('passwordModal').addEventListener('click', (e) => {
            if (e.target.id === 'passwordModal') {
                closePasswordModal();
            }
        });

        // Submit on Enter key
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyAndOpenGuide();
            }
        });
    </script>
</body>
</html>
